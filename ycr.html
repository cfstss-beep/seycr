<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コメ読み DEBUG版</title>
<style>
body { background:#111; color:#fff; font-family:sans-serif; padding:20px;}
input,button { width:100%; padding:12px; margin:6px 0;}
#log { white-space:pre-wrap; font-size:12px; background:#000; padding:10px;}
</style>
</head>
<body>

<h2>コメ読み（デバッグ）</h2>

<input id="apiKey" placeholder="APIキー">
<input id="videoId" placeholder="URL or ID">
<button onclick="start()">開始</button>

<div id="log"></div>

<script>
function log(msg){
  document.getElementById("log").textContent += msg + "\n";
}

function extractVideoId(url){
  const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : url;
}

async function start(){
  log("START押された");

  const apiKey = document.getElementById("apiKey").value.trim();
  const videoId = extractVideoId(document.getElementById("videoId").value.trim());

  if(!apiKey || !videoId){
    log("入力不足");
    return;
  }

  try{
    log("動画情報取得中...");

    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${apiKey}`
    );

    const data = await res.json();
    log(JSON.stringify(data, null, 2));

    if(!data.items || data.items.length === 0){
      log("❌ 動画見つからない");
      return;
    }

    const chatId = data.items[0].liveStreamingDetails?.activeLiveChatId;

    if(!chatId){
      log("❌ ライブじゃない or チャット無効");
      return;
    }

    log("✅ chatId取得: " + chatId);

    // コメント取得テスト
    const res2 = await fetch(
      `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${chatId}&part=snippet&key=${apiKey}`
    );

    const data2 = await res2.json();
    log("コメント取得結果:");
    log(JSON.stringify(data2, null, 2));

  }catch(e){
    log("❌ エラー: " + e.message);
  }
}
</script>

</body>
</html>
